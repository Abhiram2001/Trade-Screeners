name: Run Trade Screener

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - job1
          - job2

jobs:
  screener:
    name: Generate Screener Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Screener — ${{ github.event.inputs.job }}
        run: python Screener-1.py ${{ github.event.inputs.job }}

      - name: Upload HTML reports
        uses: actions/upload-artifact@v4
        with:
          name: screener-reports-${{ github.event.inputs.job }}-${{ github.run_number }}
          path: "*.html"
          retention-days: 30
          if-no-files-found: warn
